<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | SkillTrade Kigali</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header id="nav"></header>

  <main>
    <h1>My dashboard</h1>
    <div id="page-message" class="message" hidden></div>

    <h2>Post a skill</h2>
    <div class="card">
      <form id="skill-form">
        <label>Title <input id="skill-title" type="text" maxlength="100" required></label>
        <label>Category <select id="skill-category" required></select></label>
        <label>Description <textarea id="skill-description" rows="3" maxlength="1000" required></textarea></label>
        <button class="btn" type="submit">Post skill</button>
      </form>
    </div>

    <h2>My skills</h2>
    <section id="my-skills"></section>

    <h2>My trades</h2>
    <section id="my-trades"></section>
  </main>

  <script src="/js/app.js"></script>
  <script src="/js/dashboard.js"></script>
</body>
</html>
