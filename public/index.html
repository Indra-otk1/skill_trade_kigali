<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkillTrade Kigali</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header id="nav"></header>

  <main>
    <h1>Browse skills</h1>
    <p class="muted">Trade what you know for what you want to learn.</p>

    <div id="page-message" class="message" hidden></div>

    <form id="filters" class="filters">
      <input id="search" type="search" placeholder="Search skills, e.g. guitar, Python...">
      <select id="category"><option value="">All categories</option></select>
      <button class="btn" type="submit">Search</button>
    </form>

    <section id="skills"></section>
  </main>

  <dialog id="trade-dialog">
    <form id="trade-form">
      <h3>Request a trade</h3>
      <p id="trade-target"></p>
      <label>Offer one of your skills in return
        <select id="offer-select"></select>
      </label>
      <p id="trade-error" class="message error" hidden></p>
      <div class="dialog-buttons">
        <button type="button" id="trade-cancel" class="btn secondary">Cancel</button>
        <button type="submit" class="btn">Send request</button>
      </div>
    </form>
  </dialog>

  <script src="/js/app.js"></script>
  <script src="/js/browse.js"></script>
</body>
</html>
