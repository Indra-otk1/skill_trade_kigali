<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in | SkillTrade Kigali</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header id="nav"></header>

  <main>
    <div class="card form-card">
      <h2>Log in</h2>
      <div id="form-message" class="message" hidden></div>

      <form id="login-form">
        <label>Email <input id="login-email" type="email" required></label>
        <label>Password <input id="login-password" type="password" required></label>
        <button class="btn" type="submit">Log in</button>
      </form>
      <p class="muted">No account yet? <a href="/register.html">Register</a></p>
    </div>
  </main>

  <script src="/js/app.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
